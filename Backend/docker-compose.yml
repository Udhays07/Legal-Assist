version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: legal_assist_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123"
      POSTGRES_DB: legal-assist
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d legal-assist"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
